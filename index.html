    <!--
      Display profile, resolved before first paint.

      Runs synchronously in <head> so the stored TERMINAL/DAYLIGHT choice is on
      <html> before any pixel is painted — applying it from React would show a
      full dark render first and then snap to light. Falls back to the OS
      preference on a first visit, and to TERMINAL if storage is unavailable.
    -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("sharim-os:prefs") || "{}");
          var theme =
            saved.theme ||
            (window.matchMedia("(prefers-color-scheme: light)").matches
              ? "daylight"
              : "terminal");
          document.documentElement.dataset.theme = theme;
          if (theme === "daylight") {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#eef2f7");
          }
        } catch (e) {
          document.documentElement.dataset.theme = "terminal";
        }
      })();
    </script>

    <!--
      Counterpart to public/404.html: restores a deep-linked path that the
      Pages 404 fallback encoded as "?/path". Runs before the app mounts so
      the router (once one exists) sees the correct URL on first render.
      Inert while SPA_ROUTES in 404.html is empty.
    -->
    <script>
      (function () {
        var q = location.search;
        if (q.charAt(1) !== "/") return;
        var parts = q.slice(2).split("&");
        var path = parts[0].replace(/~and~/g, "&");
        var rest = parts.slice(1).join("&");
        history.replaceState(
          null,
          "",
          location.pathname.replace(/\/$/, "") +
            "/" +
            path +
            (rest ? "?" + rest : "") +
            location.hash
        );
      })();
    </script>
